name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install PySide6 wmi pywin32
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build
        shell: pwsh
        run: ./tools/build_gfb.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: gigahelm-windows
          path: dist/main/
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build
        shell: pwsh
        run: ./tools/build_gfb.ps1
      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/main -DestinationPath gigahelm-windows.zip
          $hash = (Get-FileHash -Algorithm SHA256 gigahelm-windows.zip).Hash
          "$hash  gigahelm-windows.zip" | Out-File gigahelm-windows.zip.sha256 -Encoding ascii
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gigahelm-windows.zip
            gigahelm-windows.zip.sha256
